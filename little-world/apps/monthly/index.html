<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月历 · 小世界</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f2ed;min-height:100vh;font-family:"STKaiti","KaiTi",serif;color:#4a4a4a;padding:2rem 1rem}
.wrap{max-width:520px;margin:0 auto}

/* 头部 */
h1{text-align:center;font-weight:normal;font-size:1.2rem;letter-spacing:6px;color:#8a7a6a;margin-bottom:0.3rem}
.sub{text-align:center;font-size:0.7rem;color:#ccc;letter-spacing:2px;margin-bottom:1.5rem}

/* 月份导航 */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding:0 0.5rem}
.month-nav .nav-btn{background:none;border:1px solid #e0d8cc;border-radius:50%;width:36px;height:36px;cursor:pointer;color:#8a7a6a;font-size:1rem;transition:all 0.3s}
.month-nav .nav-btn:hover{border-color:#c4a882;background:#fff}
.month-nav .month-title{font-size:1.1rem;letter-spacing:4px;color:#8a7a6a}
.month-nav .today-btn{background:none;border:1px solid #e0d8cc;border-radius:6px;padding:0.3rem 0.8rem;cursor:pointer;color:#8a7a6a;font-size:0.75rem;letter-spacing:2px;transition:all 0.3s}
.month-nav .today-btn:hover{border-color:#c4a882;background:#fff}

/* 星期 */

.monthly-summary{display:flex;align-items:center;justify-content:center;gap:1.2rem;padding:0.45rem 0.5rem;margin-bottom:0.6rem;font-size:0.8rem;color:#8a7a6a;background:rgba(255,255,255,0.6);border-radius:8px;letter-spacing:1px;border:1px solid #f0ece4}
.monthly-summary .ms-item{display:flex;align-items:center;gap:0.3rem}
.monthly-summary .ms-label{color:#bbb;font-size:0.7rem}
.monthly-summary .ms-value{font-weight:bold;font-size:0.85rem}
.monthly-summary .ms-value.income{color:#6a8a4a}
.monthly-summary .ms-value.expense{color:#8a6a4a}
.monthly-summary .ms-value.balance{color:#4a4a4a}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:0.7rem;color:#bbb;letter-spacing:2px;margin-bottom:0.5rem;padding:0 0.3rem}

/* 日历网格 */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:1.5rem;padding:0 0.3rem}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;font-size:0.85rem;color:#8a7a6a;transition:all 0.2s;position:relative;background:#fff;border:1px solid transparent}
.cal-day:hover{background:#f0ece4;border-color:#e0d8cc}
.cal-day.other-month{color:#ddd;background:transparent;cursor:default}
.cal-day.other-month:hover{background:transparent;border-color:transparent}
.cal-day.today{border-color:#c4a882;font-weight:bold}
.cal-day.selected{background:#e8ddd0;border-color:#c4a882}
.cal-day .mark{position:absolute;bottom:4px;display:flex;gap:3px}
.cal-day .mark .dot{width:5px;height:5px;border-radius:50%}
.cal-day .mark .dot.finance{background:#8aaa6a}
.cal-day .mark .dot.period{background:#d4a0a0}

/* 日期详情区 */
.detail-box{background:#fff;border:1px solid #e0d8cc;border-radius:12px;padding:1.2rem;margin-bottom:1.5rem;display:none}
.detail-box.show{display:block}
.detail-date{font-size:0.9rem;color:#8a7a6a;letter-spacing:2px;margin-bottom:1rem;text-align:center}

/* 分区标题 */
.section-title{font-size:0.8rem;color:#8a7a6a;letter-spacing:3px;margin-bottom:0.6rem;padding-left:0.4rem;border-left:2px solid #ddd;display:flex;justify-content:space-between;align-items:center}
.section-title .add-btn{background:none;border:1px solid #e0d8cc;border-radius:6px;padding:0.2rem 0.6rem;cursor:pointer;color:#8a7a6a;font-size:0.7rem;letter-spacing:1px;transition:all 0.3s}
.section-title .add-btn:hover{border-color:#c4a882;background:#f5f2ed}

/* 记账列表 */
.finance-list{list-style:none;margin-bottom:1.2rem}
.finance-item{display:flex;align-items:center;justify-content:space-between;padding:0.5rem 0.4rem;border-bottom:1px dashed #f0ece4;font-size:0.8rem}
.finance-item:last-child{border-bottom:none}
.finance-item .fi-left{display:flex;align-items:center;gap:0.5rem;flex:1}
.finance-item .fi-type{font-size:0.6rem;padding:0.15rem 0.4rem;border-radius:4px;background:#f0ece4;color:#8a7a6a}
.finance-item .fi-type.income{background:#e0f0d0;color:#6a8a4a}
.finance-item .fi-type.expense{background:#f0e0d0;color:#8a6a4a}
.finance-item .fi-amount{font-weight:bold;color:#4a4a4a;min-width:3rem}
.finance-item .fi-cat{color:#aaa;font-size:0.7rem}
.finance-item .fi-note{color:#999;font-size:0.7rem;margin-left:0.3rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:6rem}
.finance-item .fi-by{font-size:0.6rem;color:#c4a882;margin-left:0.3rem}
.finance-item .fi-actions{display:flex;gap:0.3rem}
.finance-item .fi-actions button{background:none;border:none;cursor:pointer;color:#ccc;font-size:0.7rem;padding:0.1rem 0.3rem;transition:color 0.2s}
.finance-item .fi-actions button:hover{color:#8a7a6a}

/* 经期记录 */
.period-box{background:#f9f5f5;border:1px solid #f0e0e0;border-radius:8px;padding:0.8rem;margin-bottom:0.5rem}
.period-status{font-size:0.85rem;color:#8a7a6a;margin-bottom:0.5rem}
.period-status .status-badge{display:inline-block;padding:0.15rem 0.6rem;border-radius:4px;font-size:0.75rem}
.period-status .status-badge.on{background:#f0d0d0;color:#c06060}
.period-status .status-badge.off{background:#f0ece4;color:#aaa}
.period-actions{display:flex;gap:0.5rem;flex-wrap:wrap}
.period-actions button{background:none;border:1px solid #e0d8cc;border-radius:6px;padding:0.3rem 0.8rem;cursor:pointer;color:#8a7a6a;font-size:0.75rem;letter-spacing:1px;transition:all 0.3s}
.period-actions button:hover{border-color:#c4a882;background:#fff}
.period-actions button.active{border-color:#c4a882;background:#f0e0e0;color:#a06060}
.period-actions button.danger{border-color:#f0d0d0;color:#c08080}
.period-actions button.danger:hover{background:#f0d0d0;color:#a06060}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#e0d8cc;border-radius:12px;transition:0.3s}
.switch .slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:0.3s}
.switch input:checked + .slider{background:#d4a0a0}
.switch input:checked + .slider:before{transform:translateX(20px)}

/* 表单弹窗 */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:100;justify-content:center;align-items:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:12px;padding:1.5rem;width:90%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,0.1)}
.modal-box h3{font-weight:normal;font-size:0.95rem;color:#8a7a6a;letter-spacing:3px;margin-bottom:1rem;text-align:center}
.modal-box label{display:block;font-size:0.75rem;color:#aaa;letter-spacing:1px;margin-bottom:0.3rem;margin-top:0.8rem}
.modal-box label:first-child{margin-top:0}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;padding:0.5rem;border:1px solid #e0d8cc;border-radius:6px;font-family:inherit;font-size:0.85rem;color:#4a4a4a;background:#faf8f5;outline:none;transition:border 0.3s}
.modal-box input:focus,.modal-box select:focus,.modal-box textarea:focus{border-color:#c4a882}
.modal-box textarea{resize:vertical;min-height:3rem}
.modal-box .modal-actions{display:flex;gap:0.8rem;margin-top:1.2rem;justify-content:center}
.modal-box .modal-actions button{padding:0.4rem 1.5rem;border-radius:6px;border:1px solid #e0d8cc;cursor:pointer;font-family:inherit;font-size:0.8rem;letter-spacing:2px;transition:all 0.3s}
.modal-box .modal-actions .btn-confirm{background:#8a7a6a;color:#fff;border-color:#8a7a6a}
.modal-box .modal-actions .btn-confirm:hover{background:#7a6a5a}
.modal-box .modal-actions .btn-cancel{background:#fff;color:#8a7a6a}
.modal-box .modal-actions .btn-cancel:hover{background:#f5f2ed}

/* 空状态 */
.empty-state{text-align:center;color:#ddd;font-size:0.8rem;padding:1rem 0;letter-spacing:2px}

/* 底部 */
.ft{text-align:center;color:#ddd;font-size:0.65rem;letter-spacing:2px;margin-top:0.5rem}
</style>
<script src="/theme/theme.js"></script>
</head>
<body>
<div class="wrap">
<h1>月 历</h1>
<p class="sub">记账 · 经期记录</p>

<div class="month-nav">
  <button class="nav-btn" id="prevMonth">‹</button>
  <span class="month-title" id="monthTitle">2026年7月</span>
  <button class="today-btn" id="goToday">今天</button>
  <button class="nav-btn" id="nextMonth">›</button>
</div>

<div class="monthly-summary" id="monthlySummary">
  <div class="ms-item"><span class="ms-label">收入</span><span class="ms-value income" id="msIncome">+0.00</span></div>
  <div class="ms-item"><span class="ms-label">支出</span><span class="ms-value expense" id="msExpense">-0.00</span></div>
  <div class="ms-item"><span class="ms-label">结余</span><span class="ms-value balance" id="msBalance">0.00</span></div>
</div>

<div class="weekdays">
  <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
</div>

<div class="calendar" id="calendar"></div>

<div class="detail-box" id="detailBox">
  <div class="detail-date" id="detailDate"></div>

  <!-- 记账 -->
  <div class="section-title">
    <span>📒 当日记账</span>
    <div style="display:flex;gap:0.3rem">
      <button class="add-btn" id="importBtn">📥 导入</button>
      <button class="add-btn" id="addFinanceBtn">+ 新增</button>
    </div>
  </div>
  <ul class="finance-list" id="financeList"></ul>

  <!-- 经期记录 -->
  <div class="section-title" style="margin-top:0.8rem">
    <span>🩸 经期记录</span>
  </div>
      <div class="period-box" id="periodBox">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem">
      <div class="period-status" id="periodStatus">加载中...</div>
      <label class="switch" title="打开=开始记录（每天自动继续）；关闭=停止记录">
        <input type="checkbox" id="periodSwitch"><span class="slider"></span>
      </label>
    </div>
    <div id="periodList" style="margin-top:0.5rem;border-top:1px dashed #eee;padding-top:0.5rem"></div>
    <div class="period-actions" id="periodEditRow" style="display:none;margin-top:0.5rem">
      <button id="editPeriodBtn">✎ 改起止日期</button>
    </div>
  </div>
  <!-- 今日总结 -->
  <div class="section-title" style="margin-top:0.8rem">
    <span>📝 今日总结</span>
    <button class="add-btn" id="editSummaryBtn">编辑</button>
  </div>
  <div id="summaryBox">
    <div id="summaryText" class="empty-state">今天还没有总结 ✨</div>
  </div>


<!-- 经期起止日修改弹窗（2026-09-19 批6 D3） -->
<div class="modal" id="periodModal">
  <div class="modal-box">
    <h3>🩸 修改经期起止日</h3>
    <label>开始日</label>
    <input type="date" id="pStart" style="width:100%;padding:0.5rem;border:1px solid #e0d8cc;border-radius:6px;font-family:inherit;font-size:0.85rem;color:#4a4a4a;background:#faf8f5;outline:none">
    <label>结束日（留空 = 进行中）</label>
    <input type="date" id="pEnd" style="width:100%;padding:0.5rem;border:1px solid #e0d8cc;border-radius:6px;font-family:inherit;font-size:0.85rem;color:#4a4a4a;background:#faf8f5;outline:none">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closePeriodModal()">取消</button>
      <button class="btn-confirm" id="savePeriodBtn">保存</button>
    </div>
  </div>
</div>

<!-- 今日总结弹窗 -->
<div class="modal" id="summaryModal">
  <div class="modal-box">
    <h3>📝 今日总结</h3>
    <label>写下今天的总结</label>
    <textarea id="sText" rows="5" placeholder="今天发生了什么？想说什么？" style="width:100%;padding:0.5rem;border:1px solid #e0d8cc;border-radius:6px;font-family:inherit;font-size:0.85rem;color:#4a4a4a;background:#faf8f5;outline:none;resize:vertical"></textarea>
    <label>记录人</label>
    <select id="sBy" style="width:100%;padding:0.5rem;border:1px solid #e0d8cc;border-radius:6px;font-family:inherit;font-size:0.85rem;color:#4a4a4a;background:#faf8f5;outline:none">
      <option value="用户">用户</option>
      <option value="助手">助手</option>
    </select>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeSummaryModal()">取消</button>
      <button class="btn-confirm" id="saveSummaryBtn">保存</button>
    </div>
  </div>
</div>

</div>

<div class="ft">点击日期查看详情 · 双方可新增修改</div>
</div>

<!-- 记账表单弹窗 -->
<div class="modal" id="financeModal">
  <div class="modal-box">
    <h3 id="financeModalTitle">新增记账</h3>
    <label>类型</label>
    <select id="fType"><option value="支出">支出</option><option value="收入">收入</option></select>
    <label>金额</label>
    <input type="number" id="fAmount" step="0.01" min="0" placeholder="0.00">
    <label>类别</label>
    <select id="fCategory">
      <option value="">选择类别</option>
      <option value="餐饮">餐饮</option>
      <option value="交通">交通</option>
      <option value="购物">购物</option>
      <option value="日用">日用</option>
      <option value="娱乐">娱乐</option>
      <option value="医疗">医疗</option>
      <option value="工资">工资</option>
      <option value="其他">其他</option>
    </select>
    <label>备注</label>
    <input type="text" id="fNote" placeholder="（选填）">
    <label>记录人</label>
    <select id="fBy"><option value="用户">用户</option><option value="助手">助手</option></select>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeFinanceModal()">取消</button>
      <button class="btn-confirm" id="saveFinanceBtn">保存</button>
    </div>
  </div>
</div>

<div class="modal" id="importModal">
  <div class="modal-box" style="max-width:520px">
    <h3>📥 导入账单</h3>
    <label>账单类型</label>
    <div style="margin-bottom:0.8rem">
      <label style="cursor:pointer;font-size:0.85rem;display:block;padding:0.15rem 0">
        <input type="radio" name="importType" value="alipay" checked> 支付宝
      </label>
      <label style="cursor:pointer;font-size:0.85rem;display:block;padding:0.15rem 0">
        <input type="radio" name="importType" value="wechat"> 微信
      </label>
    </div>
    <label>上传CSV文件</label>
    <input type="file" id="importFile" accept=".csv,.xlsx" style="margin-bottom:0.3rem">
    <div style="font-size:0.7rem;color:#bbb;margin-bottom:0.8rem">支持支付宝CSV / 微信xlsx，自动识别分类，预览确认后再导入</div>
    <div id="importPreview" style="display:none;max-height:260px;overflow-y:auto;margin-bottom:0.8rem;border:1px solid #f0ece4;border-radius:8px;padding:0.5rem">
      <div style="font-size:0.75rem;color:#aaa;margin-bottom:0.4rem">预览（共 <span id="importCount">0</span> 条）</div>
      <div id="importList"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeImportModal()">取消</button>
      <button class="btn-confirm" id="importConfirmBtn" style="display:none" onclick="confirmImport()">确认导入</button>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let currentYear = 2026, currentMonth = 7;
let selectedDate = '';

// ===== 导入账单 =====
var importData = null;

document.getElementById('importBtn').addEventListener('click', function(){
  importData = null;
  document.getElementById('importFile').value = '';
  document.getElementById('importPreview').style.display = 'none';
  document.getElementById('importConfirmBtn').style.display = 'none';
  document.getElementById('importModal').classList.add('show');
});

function closeImportModal() {
  document.getElementById('importModal').classList.remove('show');
}

document.getElementById('importFile').addEventListener('change', function(){
  var file = this.files[0];
  if (!file) return;
  var type = document.querySelector('input[name="importType"]:checked').value;
  var fd = new FormData();
  fd.append('file', file);
  fd.append('type', type);
  fd.append('confirm', 'false');
  document.getElementById('importPreview').style.display = 'block';
  document.getElementById('importList').innerHTML = '<div style="text-align:center;color:#aaa;padding:1rem">解析中...</div>';
  fetch(API + '/monthly/api/finance/import', {method:'POST', body:fd})
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.error) {
        document.getElementById('importList').innerHTML = '<div style="text-align:center;color:#c06060;padding:1rem">' + data.error + '</div>';
        return;
      }
      importData = data;
      document.getElementById('importCount').textContent = data.total;
      var h = '';
      var list = data.records || [];
      for (var i = 0; i < list.length; i++) {
        var r = list[i];
        var tc = r.type === '收入' ? 'income' : 'expense';
        h += '<div style="display:flex;align-items:center;gap:0.4rem;padding:0.25rem 0;border-bottom:1px solid #f5f2ed;font-size:0.75rem">';
        h += '<span style="color:#aaa;min-width:4.5rem;flex-shrink:0">' + r.date + '</span>';
        h += '<span class="fi-type ' + tc + '" style="flex-shrink:0">' + r.type + '</span>';
        h += '<span style="color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">' + (r.note||'') + '</span>';
        h += '<span style="font-weight:bold;min-width:3rem;text-align:right;flex-shrink:0">' + (r.type === '收入' ? '+' : '-') + r.amount + '</span>';
        h += '</div>';
      }
      document.getElementById('importList').innerHTML = h;
      document.getElementById('importConfirmBtn').style.display = 'inline-block';
    })
    .catch(function(){
      document.getElementById('importList').innerHTML = '<div style="text-align:center;color:#c06060;padding:1rem">解析失败，请检查文件格式</div>';
    });
});

function confirmImport() {
  if (!importData) return;
  var file = document.getElementById('importFile').files[0];
  var type = document.querySelector('input[name="importType"]:checked').value;
  var fd = new FormData();
  fd.append('file', file);
  fd.append('type', type);
  fd.append('confirm', 'true');
  var btn = document.getElementById('importConfirmBtn');
  btn.disabled = true;
  btn.textContent = '导入中...';
  fetch(API + '/monthly/api/finance/import', {method:'POST', body:fd})
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.ok) {
        alert('✅ 成功导入 ' + data.written + ' 条记录');
        closeImportModal();
        if (selectedDate) loadDayRecords(selectedDate);
        loadMarkers();
        if (typeof loadMonthlySummary === 'function') loadMonthlySummary();
      } else {
        alert('导入失败：' + (data.error || '未知错误'));
      }
    })
    .catch(function(){ alert('导入失败，请重试'); })
    .finally(function(){ btn.disabled = false; btn.textContent = '确认导入'; });
}


let editingFinance = null; // 编辑中的记账id

// ===== 月历渲染 =====
function renderCalendar() {
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';
  document.getElementById('monthTitle').textContent = currentYear + '年' + currentMonth + '月';

  const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
  const today = new Date();
  const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');

  // 上月补齐
  const prevMonthDays = new Date(currentYear, currentMonth - 1, 0).getDate();
  for (let i = firstDay - 1; i >= 0; i--) {
    const d = document.createElement('div');
    d.className = 'cal-day other-month';
    d.textContent = prevMonthDays - i;
    cal.appendChild(d);
  }

  // 当月
  for (let i = 1; i <= daysInMonth; i++) {
    const dateStr = currentYear + '-' + String(currentMonth).padStart(2,'0') + '-' + String(i).padStart(2,'0');
    const d = document.createElement('div');
    d.className = 'cal-day';
    d.dataset.date = dateStr;
    d.textContent = i;
    if (dateStr === todayStr) d.classList.add('today');
    if (dateStr === selectedDate) d.classList.add('selected');
    d.addEventListener('click', function(){ selectDate(this.dataset.date); });
    cal.appendChild(d);
  }

  // 下月补齐
  const totalCells = firstDay + daysInMonth;
  const remaining = (7 - totalCells % 7) % 7;
  for (let i = 1; i <= remaining; i++) {
    const d = document.createElement('div');
    d.className = 'cal-day other-month';
    d.textContent = i;
    cal.appendChild(d);
  }

  // 获取标记数据
  loadMarkers();
}

// ===== 标记加载 =====

function loadMonthlySummary() {
  fetch('/monthly/api/finance/monthly?year=' + currentYear + '&month=' + currentMonth)
    .then(function(r){ return r.json(); })
    .then(function(data){
      document.getElementById('msIncome').textContent = '+' + data.income.toFixed(2);
      document.getElementById('msExpense').textContent = '-' + data.expense.toFixed(2);
      var b = data.balance;
      document.getElementById('msBalance').textContent = (b >= 0 ? '+' : '') + b.toFixed(2);
    });
}


function loadMarkers() {
  fetch(API + '/monthly/api/markers')
    .then(r => r.json())
    .then(data => {
      document.querySelectorAll('.cal-day:not(.other-month)').forEach(el => {
        const date = el.dataset.date;
        if (!date) return;
        let marks = '';
        if (data.finance && data.finance.includes(date)) marks += '<span class="dot finance"></span>';
        if (data.period && data.period.includes(date)) marks += '<span class="dot period"></span>';
        const existing = el.querySelector('.mark');
        if (existing) existing.remove();
        if (marks) {
          const div = document.createElement('div');
          div.className = 'mark';
          div.innerHTML = marks;
          el.appendChild(div);
        }
      });
    })
    .catch(() => {});
}

// ===== 选中日期 =====
function selectDate(dateStr) {
  selectedDate = dateStr;
  document.querySelectorAll('.cal-day.selected').forEach(el => el.classList.remove('selected'));
  const el = document.querySelector('.cal-day[data-date="' + dateStr + '"]');
  if (el) el.classList.add('selected');

  const box = document.getElementById('detailBox');
  box.classList.add('show');
  const d = new Date(dateStr);
  const weekdays = ['日','一','二','三','四','五','六'];
  document.getElementById('detailDate').textContent = '📅 ' + dateStr + ' 星期' + weekdays[d.getDay()];

  loadDayRecords(dateStr);
}

// ===== 加载某天记录 =====
function loadDayRecords(dateStr) {
  fetch(API + '/monthly/api/records/' + dateStr)
    .then(r => r.json())
    .then(data => {
      renderFinance(dateStr, data.finance || []);
      renderPeriod(dateStr, data.period);
  loadSummary(dateStr);
    })
    .catch(() => {});
}

// ===== 渲染记账 =====
function renderFinance(dateStr, list) {
  const el = document.getElementById('financeList');
  if (!list || list.length === 0) {
    el.innerHTML = '<div class="empty-state">今天还没有记账 ✨</div>';
    return;
  }
  el.innerHTML = '';
  list.forEach(item => {
    const li = document.createElement('li');
    li.className = 'finance-item';
    const typeClass = item.type === '收入' ? 'income' : 'expense';
    li.innerHTML = `
      <div class="fi-left">
        <span class="fi-type ${typeClass}">${item.type}</span>
        <span class="fi-amount">${item.type === '收入' ? '+' : '-'}${item.amount}</span>
        <span class="fi-cat">${item.category || ''}</span>
        <span class="fi-note">${item.note || ''}</span>
        <span class="fi-by">· ${item.by || ''}</span>
      </div>
      <div class="fi-actions">
        <button onclick="editFinance('${dateStr}', ${item.id}, '${item.type}', ${item.amount}, '${(item.category||'').replace(/'/g,"\\'")}', '${(item.note||'').replace(/'/g,"\\'")}', '${(item.by||'涵').replace(/'/g,"\\'")}')">✎</button>
        <button onclick="deleteFinance('${dateStr}', ${item.id})">✕</button>
      </div>
    `;
    el.appendChild(li);
  });
}

// ===== 渲染经期 =====
function renderPeriod(dateStr, period) {
  const statusEl = document.getElementById('periodStatus');
  const sw = document.getElementById('periodSwitch');
  if (!sw) return;
  const isActive = !!(period && !period.end);
  sw.checked = isActive;
  if (period && !period.end) {
    statusEl.innerHTML = '状态：<span class="status-badge on">进行中</span> 从 ' + period.start + ' 开始';
  } else if (period && period.end) {
    statusEl.innerHTML = '状态：<span class="status-badge on">经期中</span>（' + period.start + ' ~ ' + period.end + '）';
  } else {
    statusEl.innerHTML = '状态：<span class="status-badge off">未记录</span>';
  }
  // 选中日落在某次经期里时，提供「改起止日期」入口（批6 D3：结束日可维护）
  window._currentPeriod = period || null;
  const editRow = document.getElementById('periodEditRow');
  if (editRow) editRow.style.display = period ? 'flex' : 'none';
  loadPeriods();
}

// ===== 经期起止日修改（批6 D3） =====
let editingPeriodStartOld = null;
function openPeriodModal(p) {
  editingPeriodStartOld = p.start;
  document.getElementById('pStart').value = p.start || '';
  document.getElementById('pEnd').value = p.end || '';
  document.getElementById('periodModal').classList.add('show');
}
function editPeriod(startOld) {
  fetch(API + '/monthly/api/periods')
    .then(r => r.json())
    .then(list => {
      const p = (list || []).find(x => x.start === startOld);
      if (!p) { alert('未找到该经期记录'); return; }
      openPeriodModal(p);
    });
}
document.getElementById('editPeriodBtn').addEventListener('click', function(){
  if (window._currentPeriod) openPeriodModal(window._currentPeriod);
});
function closePeriodModal() {
  document.getElementById('periodModal').classList.remove('show');
  editingPeriodStartOld = null;
}
document.getElementById('savePeriodBtn').addEventListener('click', function(){
  const start = document.getElementById('pStart').value;
  const end = document.getElementById('pEnd').value;
  if (!start) { alert('请选择开始日'); return; }
  if (end && end < start) { alert('结束日不能早于开始日'); return; }
  fetch(API + '/monthly/api/period/update', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({start_old: editingPeriodStartOld, start: start, end: end})
  }).then(r => r.json()).then(data => {
    if (data.error) { alert(data.error); return; }
    closePeriodModal();
    loadDayRecords(selectedDate);
    loadMarkers();
  }).catch(() => alert('保存失败，请重试'));
});
// ===== 记账新增/编辑弹窗 =====
document.getElementById('addFinanceBtn').addEventListener('click', function(){
  editingFinance = null;
  document.getElementById('financeModalTitle').textContent = '新增记账';
  document.getElementById('fType').value = '支出';
  document.getElementById('fAmount').value = '';
  document.getElementById('fCategory').value = '';
  document.getElementById('fNote').value = '';
  document.getElementById('fBy').value = '用户';
  document.getElementById('financeModal').classList.add('show');
});

function editFinance(dateStr, id, type, amount, category, note, by) {
  editingFinance = id;
  document.getElementById('financeModalTitle').textContent = '修改记账';
  document.getElementById('fType').value = type;
  document.getElementById('fAmount').value = amount;
  document.getElementById('fCategory').value = category;
  document.getElementById('fNote').value = note;
  document.getElementById('fBy').value = by;
  document.getElementById('financeModal').classList.add('show');
  document.getElementById('financeModal').dataset.editDate = dateStr;
}

function closeFinanceModal() {
  document.getElementById('financeModal').classList.remove('show');
  editingFinance = null;
}

document.getElementById('saveFinanceBtn').addEventListener('click', function(){
  const type = document.getElementById('fType').value;
  const amount = parseFloat(document.getElementById('fAmount').value);
  const category = document.getElementById('fCategory').value;
  const note = document.getElementById('fNote').value;
  const by = document.getElementById('fBy').value;
  if (isNaN(amount) || amount <= 0) { alert('请输入有效金额'); return; }

  const dateStr = selectedDate;
  if (editingFinance) {
    // 修改
    fetch(API + '/monthly/api/finance/' + dateStr + '/' + editingFinance, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type, amount, category, note})
    }).then(r => r.json()).then(() => {
      closeFinanceModal();
      loadDayRecords(dateStr);
      loadMarkers();
    });
  } else {
    // 新增
    fetch(API + '/monthly/api/finance/' + dateStr, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type, amount, category, note, by})
    }).then(r => r.json()).then(() => {
      closeFinanceModal();
      loadDayRecords(dateStr);
      loadMarkers();
    });
  }
});

// ===== 删除记账 =====
function deleteFinance(dateStr, id) {
  if (!confirm('确定删除这条记账？')) return;
  fetch(API + '/monthly/api/finance/' + dateStr + '/' + id, {method: 'DELETE'})
    .then(r => r.json()).then(() => {
      loadDayRecords(dateStr);
      loadMarkers();
    });
}

// ===== 经期开关 =====
document.getElementById('periodSwitch').addEventListener('change', function(){
  const on = this.checked;
  fetch(API + '/monthly/api/period/toggle', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({on: on, date: todayStr})
  }).then(r => r.json()).then(data => {
    if (data.error) { alert(data.error); this.checked = !on; return; }
    loadDayRecords(selectedDate);
    loadMarkers();
  }).catch(() => { this.checked = !on; });
});

function deletePeriod(dateStr) {
  if (!confirm('确定删除包含该天的经期记录？')) return;
  fetch(API + '/monthly/api/period/' + dateStr, {method: 'DELETE'})
    .then(r => r.json()).then(() => {
      loadDayRecords(selectedDate);
      loadMarkers();
    });
}

// ===== 经期范围列表 =====
function loadPeriods() {
  fetch(API + '/monthly/api/periods')
    .then(r => r.json())
    .then(list => {
      const el = document.getElementById('periodList');
      if (!el) return;
      if (!list || list.length === 0) {
        el.innerHTML = '<div style="font-size:0.75rem;color:#ccc;padding:0.2rem 0">还没有经期记录</div>';
        return;
      }
      el.innerHTML = list.slice().sort((a, b) => (b.start || '').localeCompare(a.start || '')).map(p => {
        const rangeText = p.end ? (p.start + ' ~ ' + p.end) : (p.start + ' ~ 进行中');
        return `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;padding:0.2rem 0;font-size:0.75rem;color:#8a7a6a">
          <span>${rangeText}</span>
          <span style="display:flex;align-items:center;gap:0.4rem">
            <button class="danger" style="background:none;border:none;color:#b5837a;cursor:pointer;font-size:0.78rem" onclick="editPeriod('${p.start}')">✎</button>
            <button class="danger" style="background:none;border:none;color:#c08080;cursor:pointer;font-size:0.85rem" onclick="deletePeriod('${p.start}')">✕</button>
          </span>
        </div>`;
      }).join('');
    })
    .catch(() => {});
}
// ===== 今日总结 =====
function loadSummary(dateStr) {
  fetch(API + '/monthly/api/summary/' + dateStr)
    .then(r => r.json())
    .then(data => {
      const el = document.getElementById('summaryText');
      if (data.text) {
        el.className = '';
        el.style.cssText = 'font-size:0.85rem;color:#4a4a4a;line-height:1.8;padding:0.5rem 0.4rem;white-space:pre-wrap';
        el.textContent = data.text;
        const bySpan = document.createElement('div');
        bySpan.style.cssText = 'font-size:0.65rem;color:#c4a882;margin-top:0.4rem;letter-spacing:1px';
        bySpan.textContent = '· ' + (data.by || '') + ' · ' + (data.updated_at ? data.updated_at.slice(0,10) : '');
        el.appendChild(bySpan);
      } else {
        el.className = 'empty-state';
        el.style.cssText = '';
        el.textContent = '今天还没有总结 ✨';
      }
    });
}

document.getElementById('editSummaryBtn').addEventListener('click', function(){
  const dateStr = selectedDate;
  fetch(API + '/monthly/api/summary/' + dateStr)
    .then(r => r.json())
    .then(data => {
      document.getElementById('sText').value = data.text || '';
      document.getElementById('sBy').value = data.by || '用户';
      document.getElementById('summaryModal').classList.add('show');
    });
});

document.getElementById('saveSummaryBtn').addEventListener('click', function(){
  const text = document.getElementById('sText').value.trim();
  if (!text) { alert('写点什么吧'); return; }
  const by = document.getElementById('sBy').value;
  fetch(API + '/monthly/api/summary/' + selectedDate, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text, by})
  }).then(r => r.json()).then(() => {
    document.getElementById('summaryModal').classList.remove('show');
    loadSummary(selectedDate);
    loadMarkers();
  });
});

function closeSummaryModal() {
  document.getElementById('summaryModal').classList.remove('show');
}


// ===== 月份导航 =====
document.getElementById('prevMonth').addEventListener('click', function(){
  currentMonth--;
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  renderCalendar();
  loadMonthlySummary();
});
document.getElementById('nextMonth').addEventListener('click', function(){
  currentMonth++;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  renderCalendar();
  loadMonthlySummary();
});
document.getElementById('goToday').addEventListener('click', function(){
  const today = new Date();
  currentYear = today.getFullYear();
  currentMonth = today.getMonth() + 1;
  renderCalendar();
  loadMonthlySummary();
  const dateStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  selectDate(dateStr);
});

// ===== 点击遮罩关闭弹窗 =====
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', function(e){
    if (e.target === this) this.classList.remove('show');
  });
});

// ===== 初始化 =====
const today = new Date();
currentYear = today.getFullYear();
currentMonth = today.getMonth() + 1;
renderCalendar();
loadMonthlySummary();
const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
selectDate(todayStr);
</script>
